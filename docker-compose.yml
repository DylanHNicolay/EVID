services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./INIT.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./SEED.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb && psql -U admin -d mydb -c 'SELECT 1 FROM meets LIMIT 1' -q"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks:
      - app_network

  # pgadmin:
  #   image: dpage/pgadmin4:9.12
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - app_network
  #   depends_on:
  #     - postgres

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: divecloud_api
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=postgres
      - DB_NAME=mydb
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

  react_app:
    build:
      context: ./divecloud-react
      dockerfile: Dockerfile
    container_name: react_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./divecloud-react/src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true 
      - REACT_APP_API_URL=http://localhost:5050
    networks:
      - app_network
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
    driver: bridge